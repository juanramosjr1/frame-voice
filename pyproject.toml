[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "frame-voice"
version = "0.3.0"
description = "fuelCell Voice Typing: speak into any text box on the Steam Frame"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["faster-whisper>=1.0", "PySide6-Essentials>=6.5", "openvr>=2.0"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
frame-voice = "frame_voice.app:main"

[tool.setuptools]
packages = ["frame_voice"]

[tool.setuptools.package-data]
frame_voice = ["steamvr/*.json"]
