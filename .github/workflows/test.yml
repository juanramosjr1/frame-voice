name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm uses the same kind of ARM chip family as the Steam Frame.
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q espeak-ng libegl1 libgl1 libxkbcommon0 \
            libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 linux-libc-dev

      - name: Install with the real installer
        run: bash install.sh

      - name: Allow uinput and input devices for the end-to-end test
        run: |
          sudo modprobe uinput
          sudo chmod 666 /dev/uinput
          sudo chmod a+r /dev/input/event* || true
          # new devices created by the test need to be readable too
          echo 'KERNEL=="event*", SUBSYSTEM=="input", MODE="0666"' | sudo tee /etc/udev/rules.d/99-ci.rules
          sudo udevadm control --reload-rules

      - name: System check
        run: |
          ~/.local/share/frame-voice/venv/bin/frame-voice --check 2>&1 | tee check.log || true
          grep -E "^\s+(OK|FIX)" check.log | sed 's/^ */::notice title=check::/' || true

      - name: Starts and stops with SteamVR (a real user session, stand-in SteamVR service)
        run: |
          sudo loginctl enable-linger "$(id -un)"
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          for i in $(seq 30); do [ -S "$XDG_RUNTIME_DIR/bus" ] && break; sleep 1; done
          # SteamOS on the Frame runs SteamVR as this user service.
          mkdir -p ~/.config/systemd/user
          printf '[Unit]\nDescription=stand-in for SteamVR\n[Service]\nExecStart=/bin/sleep infinity\n' \
            > ~/.config/systemd/user/steamvr.service
          systemctl --user daemon-reload
          VENV=~/.local/share/frame-voice/venv
          $VENV/bin/frame-voice --register
          systemctl --user is-enabled frame-voice.service
          systemctl --user start steamvr.service
          for i in $(seq 60); do
            check=$($VENV/bin/frame-voice --check 2>&1 || true)
            grep -q "Running in the background" <<<"$check" && break
            sleep 1
          done
          systemctl --user --no-pager status frame-voice.service 2>&1 | head -5 || true
          # fails the step if the background copy never answered
          grep "Running in the background" <<<"$check" | sed 's/^ */::notice title=started with SteamVR::/'
          systemctl --user stop steamvr.service
          sleep 3
          if systemctl --user is-active -q frame-voice.service; then
            echo "::error title=autostart::still running after SteamVR stopped"; exit 1
          fi
          echo "::notice title=autostart::stopped with SteamVR"

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
          FRAME_VOICE_E2E: "1"
        run: |
          VENV=~/.local/share/frame-voice/venv
          $VENV/bin/pip install -q pytest
          set +e
          $VENV/bin/python -m pytest -rA --tb=short -p no:cacheprovider tests 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          # Surface results as annotations so they're readable without the raw log.
          grep -E "^(FAILED|ERROR) tests/" pytest.log | head -10 | sed 's/^/::error title=test::/'
          grep -E "^E +" pytest.log | head -10 | sed 's/^/::warning title=detail::/'
          grep -E "heard:|passed|failed" pytest.log | tail -3 | sed 's/^/::notice title=result::/'
          exit $status
